[package]
name = "nanocode-interpreter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autobenches = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"

[workspace]
